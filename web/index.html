<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>DonatUZ</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <header>
        <div>
            <div class="logo">
                DONAT<span>UZ</span>
            </div>

            <div class="sub">
                Games • Stars • Premium
            </div>
        </div>

        <div class="avatar">🎮</div>
    </header>


    <section class="hero">

        <div>
            <div class="badge">⚡ FAST & SIMPLE</div>

            <h1>
                Donat qilish<br>
                endi juda oson.
            </h1>

            <p>
                Sevimli o‘yinlaringizga tez va qulay
                tarzda donat qiling.
            </p>
        </div>

        <div class="hero-icon">
            🎮
        </div>

    </section>


    <h2>Xizmatlar</h2>

    <div class="services">

        <button
            class="service stars"
            onclick="openService('stars')"
        >
            <span>⭐</span>

            <div>
                <b>Telegram Stars</b>
                <small>Stars sotib olish</small>
            </div>
        </button>


        <button
            class="service premium"
            onclick="openService('premium')"
        >
            <span>💎</span>

            <div>
                <b>Telegram Premium</b>
                <small>Premium sotib olish</small>
            </div>
        </button>

    </div>


    <div id="home">

        <h2>🎮 O‘yinlar</h2>

        <div
            id="games"
            class="games"
        >
            <div class="loading">
                Yuklanmoqda...
            </div>
        </div>

    </div>


    <section
        id="gamePage"
        class="page hidden"
    >

        <button
            class="back"
            onclick="goHome()"
        >
            ← Orqaga
        </button>

        <div id="gameTitle"></div>

        <label>Player ID / UID</label>

        <input
            id="playerId"
            type="text"
            placeholder="Player ID / UID"
        >

        <h3>Paketni tanlang</h3>

        <div id="packages"></div>

        <button
            class="main-btn"
            onclick="createOrder()"
        >
            Buyurtma berish
        </button>

    </section>


    <section
        id="servicePage"
        class="page hidden"
    >

        <button
            class="back"
            onclick="goHome()"
        >
            ← Orqaga
        </button>

        <div id="serviceContent"></div>

    </section>


    <footer>
        <b>DONATUZ</b>
        <span>Fast • Simple • Secure</span>
    </footer>

</div>


<script src="/app.js"></script>

</body>
</html>
