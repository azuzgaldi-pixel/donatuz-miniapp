<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>DonatUZ</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div>
            <div class="logo">DONAT<span>UZ</span></div>
            <div class="subtitle">
                Games • Stars • Premium
            </div>
        </div>

        <div class="user-avatar" id="userAvatar">
            👤
        </div>

    </header>


    <!-- BALANCE CARD -->

    <section class="hero-card">

        <div class="hero-text">
            <small>DONAT UZ</small>

            <h1>
                O'yinlaringizga<br>
                <span>donat qiling 🎮</span>
            </h1>

            <p>
                Tez, qulay va zamonaviy
            </p>
        </div>

        <div class="hero-icon">
            🎮
        </div>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <span>🔎</span>

        <input
            type="text"
            id="searchInput"
            placeholder="O'yinni qidiring..."
        >

    </div>


    <!-- CATEGORY -->

    <div class="categories">

        <button
            class="category active"
            data-category="games"
        >
            🎮 O'yinlar
        </button>

        <button
            class="category"
            data-category="telegram"
        >
            ⭐ Telegram
        </button>

    </div>


    <!-- GAMES -->

    <section id="gamesSection">

        <div class="section-title">
            <h2>🔥 Mashhur o'yinlar</h2>
        </div>

        <div
            id="gamesGrid"
            class="games-grid"
        >
        </div>

    </section>


    <!-- TELEGRAM -->

    <section
        id="telegramSection"
        style="display:none;"
    >

        <div class="section-title">
            <h2>⭐ Telegram xizmatlari</h2>
        </div>

        <div
            id="telegramGrid"
            class="telegram-grid"
        >
        </div>

    </section>


    <!-- MODAL -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div class="modal-content">

            <button
                id="closeModal"
                class="close-button"
            >
                ✕
            </button>

            <div id="modalIcon"></div>

            <h2 id="modalTitle">
                O'yin
            </h2>

            <p id="modalDescription">
                Player ID kiriting
            </p>

            <input
                id="playerId"
                class="player-input"
                type="text"
                placeholder="Player ID / UID"
            >

            <div id="priceList"></div>

            <button
                id="orderButton"
                class="order-button"
            >
                Buyurtma berish
            </button>

        </div>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading hidden"
    >
        <div class="loader"></div>
        <p>Yuklanmoqda...</p>
    </div>


</div>

<script src="/app.js"></script>

</body>
</html>
